<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Machine Manager</h1>
    <nav>
      <button class="tab active" data-tab="fields">Field Configuration</button>
      <button class="tab" data-tab="machines">Machine Records</button>
      <button class="tab" data-tab="predict">Risk Prediction</button>
    </nav>
  </header>

  <main>
    <!-- Field configuration -->
    <section id="tab-fields">
      <div class="card">
        <h2>Fields</h2>
        <table id="fields-table"></table>
      </div>

      <div class="card">
        <h2>Add Field</h2>
        <div class="row">
          <div>
            <label for="field-name">Field name</label>
            <input id="field-name" type="text" placeholder="e.g. Humidity">
          </div>
          <div>
            <label for="field-type">Type</label>
            <select id="field-type">
              <option value="text">Text</option>
              <option value="number">Number</option>
              <option value="dropdown">Dropdown</option>
            </select>
          </div>
          <div id="options-box" class="hidden">
            <label for="field-options">Options (comma separated)</label>
            <input id="field-options" type="text" placeholder="Low, Medium, High">
          </div>
        </div>
        <label><input id="field-required" type="checkbox"> Required</label>
        <button id="add-field-btn" class="btn">Add Field</button>
      </div>
    </section>

    <!-- Machine records -->
    <section id="tab-machines" class="hidden">
      <div class="card">
        <h2>Machines</h2>
        <div class="table-wrap"><table id="machines-table"></table></div>
      </div>

      <div class="card">
        <h2 id="form-title">New Machine</h2>
        <div id="machine-form"></div>
        <button id="save-machine-btn" class="btn">Save</button>
        <button id="clear-form-btn" class="btn secondary">Clear</button>
      </div>
    </section>

    <!-- Prediction -->
    <section id="tab-predict" class="hidden">
      <div class="card">
        <h2>Predict Risk</h2>
        <label for="predict-machine">Select a machine</label>
        <select id="predict-machine"></select>
        <button id="predict-btn" class="btn">Run Prediction</button>
        <div id="predict-result"></div>
      </div>
    </section>
  </main>

  <div id="message" class="message hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
